 plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

android {
    namespace "com.ncore"
    compileSdk 34
    buildToolsVersion "34.0.0"
    ndkVersion "24.0.8215888"

    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    defaultConfig {
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "1.0"
        consumerProguardFiles "proguard.txt"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding "UTF-8"
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        aidl true
        prefab true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption("Xdoclint:none", "-quiet")
    options.addStringOption("encoding", "UTF-8")
    options.addStringOption("charSet", "UTF-8")
}

dependencies {
 // implementation 'com.github.tiann:FreeReflection:3.2.2'
// implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'
// annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.2'
// compileOnly "com.google.auto.service:auto-service:1.1.1"
    implementation "androidx.appcompat:appcompat:1.2.0"

    annotationProcessor "com.google.auto.service:auto-service:1.1.1"

    implementation "com.squareup:javapoet:1.13.0"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
}
